services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://feeder:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db/feeder
      ENVIRONMENT: production
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://secondstack.t1a.io/gateway/api/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: feeder
      POSTGRES_USER: feeder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeder"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
