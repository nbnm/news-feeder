[project]
name = "news-feeder-backend"
version = "0.1.0"
description = "News Feeder collection, digest, LiteLLM, and Telegram service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.13,<5",
  "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
packaging = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
